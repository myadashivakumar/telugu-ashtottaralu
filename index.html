<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>అష్టోత్తర శతనామావళి</title>
<meta name="description" content="వివిధ దేవతల అష్టోత్తర శతనామావళి — తెలుగులో, ఆఫ్‌లైన్‌లో కూడా చదవగలిగేలా.">
<meta name="theme-color" content="#4A1420">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="అష్టోత్తరాలు">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ramabhadra&family=Mallanna&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app">

  <!-- HOME: shrine grid -->
  <section id="view-home" class="view view-home" aria-label="దేవతల జాబితా">
    <header class="home-header">
      <div class="home-header__flame" aria-hidden="true">
        <svg viewBox="0 0 100 100"><use href="#icon-flame"></use></svg>
      </div>
      <h1 class="home-title">అష్టోత్తర శతనామావళి</h1>
      <p class="home-subtitle">108 Names &middot; Telugu &middot; ఆఫ్‌లైన్‌లో చదవండి</p>
    </header>

    <div id="shrine-grid" class="shrine-grid" role="list"></div>

    <footer class="home-footer">
      <p>ప్రతిరోజూ భక్తితో పఠించండి</p>
    </footer>
  </section>

  <!-- DETAIL: 108-name scroll -->
  <section id="view-detail" class="view view-detail" aria-label="నామావళి" hidden>
    <header id="detail-header" class="detail-header">
      <button id="btn-back" class="btn-back" aria-label="వెనుకకు">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 4L7 12l8 8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>జాబితా</span>
      </button>
      <div class="detail-header__symbol" id="detail-symbol" aria-hidden="true"></div>
      <h2 id="detail-title" class="detail-title"></h2>
      <p id="detail-subtitle" class="detail-subtitle"></p>
    </header>

    <ol id="name-list" class="name-list"></ol>

    <div class="detail-end" id="detail-end">
      <p id="detail-end-text"></p>
    </div>
  </section>

</div>

<!-- inline SVG symbol sprite (line icons, original simple shapes — not depicting any deity) -->
<svg style="display:none">
  <defs>
    <symbol id="icon-flame" viewBox="0 0 100 100">
      <path d="M50 12 C38 30 30 42 30 58 a20 20 0 0 0 40 0 c0 -16 -8 -28 -20 -46z" />
      <path d="M50 42 C45 50 42 56 42 63 a8 8 0 0 0 16 0 c0 -7 -3 -13 -8 -21z" fill="#4A1420" opacity="0.35"/>
    </symbol>
    <symbol id="icon-om" viewBox="0 0 100 100">
      <circle cx="50" cy="20" r="6"/>
      <path d="M50 32 v10" stroke="currentColor" stroke-width="6" stroke-linecap="round" fill="none"/>
      <path d="M22 78 C22 55 40 50 50 62 C58 72 46 82 36 76 C48 90 78 84 76 60 C74 44 56 40 46 50" stroke="currentColor" stroke-width="7" stroke-linecap="round" fill="none"/>
    </symbol>
    <symbol id="icon-trishul" viewBox="0 0 100 100">
      <path d="M50 90 V25" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
      <path d="M50 30 L30 12 M50 30 L50 8 M50 30 L70 12" stroke="currentColor" stroke-width="6" stroke-linecap="round" fill="none"/>
      <path d="M34 55 h32" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-lotus" viewBox="0 0 100 100">
      <path d="M50 85 C30 85 18 68 18 52 C30 58 40 62 50 62 C60 62 70 58 82 52 C82 68 70 85 50 85 Z"/>
      <path d="M50 62 C42 48 42 30 50 15 C58 30 58 48 50 62 Z" opacity="0.85"/>
      <path d="M50 62 C36 55 26 42 24 28 C40 30 48 42 50 62 Z" opacity="0.7"/>
      <path d="M50 62 C64 55 74 42 76 28 C60 30 52 42 50 62 Z" opacity="0.7"/>
    </symbol>
    <symbol id="icon-conch" viewBox="0 0 100 100">
      <path d="M35 20 C25 32 22 48 30 62 C36 73 48 82 62 80 C76 78 84 64 78 52 C74 44 64 42 58 48 C53 53 55 60 61 62" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="35" cy="20" r="5"/>
    </symbol>
    <symbol id="icon-veena" viewBox="0 0 100 100">
      <ellipse cx="28" cy="70" rx="16" ry="12"/>
      <path d="M40 64 L82 22" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
      <circle cx="82" cy="22" r="7"/>
      <path d="M46 58 L74 30 M50 62 L78 34" stroke="currentColor" stroke-width="2.5" opacity="0.7"/>
    </symbol>
    <symbol id="icon-gada" viewBox="0 0 100 100">
      <circle cx="50" cy="28" r="18"/>
      <path d="M50 46 V88" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>
      <path d="M38 88 h24" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>
    </symbol>
  </defs>
</svg>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
