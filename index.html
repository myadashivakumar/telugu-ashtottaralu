<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>అష్టోత్తర శతనామావళి</title>
<meta name="description" content="వివిధ దేవతల అష్టోత్తర శతనామావళి — తెలుగులో, ఆఫ్‌లైన్‌లో కూడా చదవగలిగేలా.">
<meta name="theme-color" content="#221A12">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="అష్టోత్తరాలు">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ramabhadra&family=Mallanna&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app">

  <!-- HOME: shrine grid -->
  <section id="view-home" class="view view-home" aria-label="దేవతల జాబితా">
    <header class="home-header">
      <div class="home-header__flame" aria-hidden="true">
        <svg viewBox="0 0 100 100"><use href="#icon-flame"></use></svg>
      </div>
      <p class="home-eyebrow">❖ నిత్య పారాయణ ప్రతిక ❖</p>
      <h1 class="home-title">అష్టోత్తర శతనామావళి</h1>
      <p class="home-subtitle">108 Names &middot; Telugu &middot; ఆఫ్‌లైన్‌లో చదవండి</p>
      <p class="home-dateline">సంపుటి ౧ &nbsp;·&nbsp; సప్త దేవతా ప్రత్యేక సంచిక &nbsp;·&nbsp; సర్వహక్కులు భక్తులవి</p>
    </header>

    <div id="shrine-grid" class="shrine-grid" role="list"></div>

    <footer class="home-footer">
      <p>ప్రతిరోజూ భక్తితో పఠించండి</p>
      <p class="home-footer__credit">చిత్రాలు: రాజా రవివర్మ &amp; సమకాలీన కళాకారులు &middot; సార్వజనిక సంపద (Public Domain)</p>
    </footer>
  </section>

  <!-- DETAIL: 108-name scroll -->
  <section id="view-detail" class="view view-detail" aria-label="నామావళి" hidden>
    <header id="detail-header" class="detail-header">
      <button id="btn-back" class="btn-back" aria-label="వెనుకకు">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 4L7 12l8 8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>జాబితా</span>
      </button>
      <div class="detail-header__portrait" id="detail-symbol" aria-hidden="true"></div>
      <h2 id="detail-title" class="detail-title"></h2>
      <p id="detail-subtitle" class="detail-subtitle"></p>
    </header>

    <ol id="name-list" class="name-list"></ol>

    <div class="detail-end" id="detail-end">
      <p id="detail-end-text"></p>
    </div>
  </section>

</div>

    <symbol id="icon-gada" viewBox="0 0 100 100">

</svg>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
